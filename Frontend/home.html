<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindMate | Home</title>

    <link rel="stylesheet" href="CSS/global.css">
    <link rel="stylesheet" href="CSS/home.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" href="Image Asset/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="Image Asset/Logo.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header>

        <nav class="navbar">

            <div class="logo">

                <img src="Image Asset/Logo.svg" alt="MindMate Logo">

                <span class="logo-text">
                    <span class="mind">Mind</span><span class="mate">Mate</span>
                </span>

            </div>

            <ul class="nav-links">

                <li><a href="home.html" class="active">Home</a></li>

                <li><a href="daily-check-in.html">Daily Check-In</a></li>

                <li><a href="journal.html">Journal</a></li>

                <li><a href="wellness.html">Wellness</a></li>

                <li><a href="report.html">Report</a></li>

            </ul>

            <div class="profile">

                <button class="profile-btn">

                    <i class="fa-solid fa-circle-user"></i>
                    <i class="fa-solid fa-chevron-down"></i>

                </button>

                <div class="profile-dropdown">

                    <a href="index.html">

                        <i class="fa-solid fa-right-from-bracket"></i>

                        Logout

                    </a>

                </div>

            </div>

        </nav>

    </header>

    <!-- ================= MAIN ================= -->

    <main>

        <section class="chat-home" id="chatHome">

            <div class="hero-text" id="heroText">

                <h1>What can I help you with today?</h1>

            </div>

            <div class="chat-box">

                <div class="messages">

                    <!-- Chat Messages -->

                </div>

                <div class="chat-input">

                    <input type="text" placeholder="Message MindMate...">

                    <button class="mic-btn">

                        <i class="fa-solid fa-microphone"></i>

                    </button>

                    <button class="send-btn">

                        <i class="fa-solid fa-arrow-up"></i>

                    </button>

                </div>

            </div>

        </section>

    </main>

    <script src="script.js/home.js"></script>

</body>

</html>
