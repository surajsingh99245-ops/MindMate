<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMate | Personal Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="journal-header">
        <div class="container journal-nav">
            <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back</a>
            <div class="logo">
                <img src="Image Asset/Logo.svg" alt="MindMate Logo">
                <span class="logo-text"><span class="mind">Mind</span><span class="mate">Mate</span></span>
            </div>
        </div>
    </header>

    <main class="journal-page">
        <section class="journal-hero">
            <div class="container journal-layout">
                <div class="journal-editor">
                    <div class="journal-header-block">
                        <span class="section-badge">📝 Personal Journal</span>
                        <h1>Write your thoughts clearly.</h1>
                        <p>Capture a note with a title, then save it with the exact date and time.</p>
                    </div>

                    <form class="journal-form" id="journalForm">
                        <label for="noteTitle">Title</label>
                        <input type="text" id="noteTitle" placeholder="Enter title" required>

                        <label for="noteText">Note</label>
                        <textarea id="noteText" placeholder="Write your note here..." required></textarea>

                        <button type="submit">Save Note</button>
                    </form>
                </div>

                <aside class="journal-list">
                    <div class="journal-list-header">
                        <h3>Saved Notes</h3>
                        <span id="noteCount">0 notes</span>
                    </div>
                    <div id="notesContainer" class="notes-container"></div>
                </aside>
            </div>
        </section>
    </main>

    <script>
        const form = document.getElementById('journalForm');
        const titleInput = document.getElementById('noteTitle');
        const textInput = document.getElementById('noteText');
        const notesContainer = document.getElementById('notesContainer');
        const noteCount = document.getElementById('noteCount');

        const STORAGE_KEY = 'mindmate-journal-notes';
        let notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

        function saveNotes() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
        }

        function renderNotes() {
            if (notes.length === 0) {
                notesContainer.innerHTML = '<p class="empty-state">No notes yet. Start writing your first one.</p>';
                noteCount.textContent = '0 notes';
                return;
            }

            noteCount.textContent = `${notes.length} note${notes.length > 1 ? 's' : ''}`;
            notesContainer.innerHTML = notes.map((note, index) => `
                <article class="note-item ${note.completed ? 'completed' : ''}">
                    <div class="note-meta">${note.timestamp}</div>
                    <div class="note-editable">
                        <h4 contenteditable="true" data-field="title" data-index="${index}">${note.title}</h4>
                        <p contenteditable="true" data-field="text" data-index="${index}">${note.text}</p>
                    </div>
                    <div class="note-actions">
                        <label class="check-label">
                            <input type="checkbox" ${note.completed ? 'checked' : ''} data-index="${index}">
                            <span>Completed</span>
                        </label>
                        ${note.completed ? `<button type="button" class="delete-btn" data-index="${index}">Delete</button>` : ''}
                    </div>
                </article>
            `).join('');

            document.querySelectorAll('.check-label input').forEach(input => {
                input.addEventListener('change', function () {
                    const index = Number(this.getAttribute('data-index'));
                    notes[index].completed = this.checked;
                    saveNotes();
                    renderNotes();
                });
            });

            document.querySelectorAll('.delete-btn').forEach(button => {
                button.addEventListener('click', function () {
                    const index = Number(this.getAttribute('data-index'));
                    notes.splice(index, 1);
                    saveNotes();
                    renderNotes();
                });
            });

            document.querySelectorAll('.note-editable h4, .note-editable p').forEach(element => {
                element.addEventListener('blur', function () {
                    const index = Number(this.getAttribute('data-index'));
                    const field = this.getAttribute('data-field');
                    const value = this.textContent.trim();

                    if (!value) {
                        this.textContent = field === 'title' ? 'Untitled Note' : 'Write your note here...';
                    }

                    notes[index][field] = this.textContent.trim();
                    saveNotes();
                    renderNotes();
                });
            });
        }

        function saveNote() {
            const title = titleInput.value.trim();
            const text = textInput.value.trim();

            if (!title || !text) return;

            const now = new Date();
            const timestamp = now.toLocaleString();

            notes.unshift({ title, text, timestamp, completed: false });
            saveNotes();
            renderNotes();
            form.reset();
            titleInput.focus();
        }

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            saveNote();
        });

        titleInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                textInput.focus();
            }
        });

        textInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                saveNote();
            }
        });

        renderNotes();
    </script>
</body>
</html>
