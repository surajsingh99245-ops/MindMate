<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindMate | Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="icon" href="Image Asset/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="Image Asset/Logo.svg">
  <link rel="stylesheet" href="./css/global.css" />
  <link rel="stylesheet" href="./css/signup.css" />
</head>

<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-card">
      <a href="index.html" class="back-home">← Back to Home</a>
      <div class="auth-brand">
        <img src="Image Asset/Logo.svg" alt="MindMate Logo" class="brand-logo" />
        <div>
          <h1>Create Account</h1>
          <p>Join MindMate and start building better habits.</p>
        </div>
      </div>

      <form class="auth-form" id="signupForm">
        <label>
          Full Name
          <input type="text" id="fullName" placeholder="Your full name" required />
        </label>

        <label>
          Username
          <input type="text" id="username" placeholder="Choose a username" required />
        </label>

        <label>
          Password
          <input type="password" id="password" maxlength="32" placeholder="Create a strong password" required />
        </label>

        <label>
          Confirm Password
          <input type="password" id="confirmPassword" maxlength="32" placeholder="Re-enter password" required />
        </label>

        <button type="submit" class="auth-btn primary-btn">
          Create Account
        </button>

        <div class="auth-divider">
          <span>or</span>
        </div>
      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>
    </div>
  </div>
  <script src="./script.js/signup.js"></script>
</body>

</html>
